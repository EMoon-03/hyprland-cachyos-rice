[general]
; nice the game up relative to background tasks
renice=10
; CPU governor while a game runs, and what it goes back to after. amd-pstate
; (Ryzen) only offers performance and powersave - powersave still boosts fully.
desiredgov=performance
defaultgov=powersave
softrealtime=auto
inhibit_screensaver=1
reaper_freq=5

[custom]
; silence notifications for the duration (Quickshell DND), restore afterwards
start=@HOME@/.local/bin/gamemode-start.sh
end=@HOME@/.local/bin/gamemode-end.sh
