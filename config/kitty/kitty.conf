# kitty. Colours are colors.conf, generated from the wallpaper by matugen;
# rice-theme-reload sends SIGUSR1, which makes running kittys re-read this.
background_opacity          0.85
cursor_trail                1
window_padding_width        25

include colors.conf

# Dark blue background instead of the wallpaper's colour (after the include, so
# it wins). The other colours still follow the wallpaper.
background                  #0b1630
