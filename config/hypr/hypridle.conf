general {
    # The Quickshell lock screen (Lock.qml). `qs ipc` exits non-zero when
    # Quickshell is not running, and then hyprlock locks instead - never both.
    lock_cmd = qs -c rice ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# No lock when idle: the screens just turn off and wake straight to the desktop.
# SUPER + ESC still locks by hand, and it locks before the PC sleeps.
# To lock after idle again, add back:
#   listener {
#       timeout = 900                          # 15 min - lock
#       on-timeout = loginctl lock-session
#   }

listener {
    timeout = 1200                             # 20 min - screens off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
